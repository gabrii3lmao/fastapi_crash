[project]
name = "fast-zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "gabrii3lmao", email = "gabrielmluz56@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
fast-zero = "fast_zero:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
    "ruff>=0.16.8",
    "taskipy>=1.14.1",
    "typos>=1.50.2",
]

[tool.taskipy.tasks]
lint = "ruff check"
format = "ruff check --fix && ruff format"
serve = "fastapi dev src/fast_zero/app.py"
pre_test = "task lint"
tests = "pytest -s -x -vv && coverage html --show-contexts"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = [
    '-p',
    'no:warnings',
    '--cov=fast_zero',
    '--cov-context=test',
    '--cov-branch',
    '--random-order'
]
asyncio_default_fixture_loop_scope = 'function'

[tool.typos.default]
extend-ignore-identifiers-re = ["selectin"]

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "uv"
major_version_zero = true
